[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-sentinel"
version = "1.0.0"
description = "AI-powered pre-signing firewall for crypto exchange hot wallets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["crypto", "exchange", "security", "hot-wallet", "anomaly-detection", "mpc", "web3"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "cryptography>=42",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
sentinel = "sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/webphilo/vault-sentinel"
Issues = "https://github.com/webphilo/vault-sentinel/issues"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
sentinel = ["dashboard/*.html"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S104", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
