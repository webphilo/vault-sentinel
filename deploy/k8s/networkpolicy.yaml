# Only the signing service and the operator console may reach VaultSentinel.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-sentinel
  namespace: wallet-security
spec:
  podSelector:
    matchLabels: { app: vault-sentinel }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { role: signer } }
        - podSelector: { matchLabels: { role: operator-console } }
        - namespaceSelector: { matchLabels: { name: monitoring } }
      ports:
        - { port: 8080, protocol: TCP }
