# Example only. Create the real secret from your secret manager, never commit values.
apiVersion: v1
kind: Secret
metadata:
  name: vault-sentinel-secrets
  namespace: wallet-security
type: Opaque
stringData:
  SENTINEL_API_KEY: "<service key>"
  SENTINEL_OPERATOR_KEYS: "alice:<key>,bob:<key>,carol:<key>"
  SENTINEL_SIGNING_KEY: "<output of: sentinel keygen>"
  ETHERSCAN_API_KEY: "<key>"
  TELEGRAM_BOT_TOKEN: "<token>"
  TELEGRAM_CHAT_ID: "<chat id>"
